<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@6.1.19/index.global.min.js'></script>
    <link rel="stylesheet" type="text/css" href="css/schedule/schedule.css">
    <script>

      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
        eventColor: 'transparent',
        events:'/api/events',
        fixedWeekCount: false,
        locale: 'ko',
        dayCellContent: function(arg){
            return arg.date.getDate()
        },
        headerToolbar: {
            left: '',// 왼쪽
            center: 'title',         
            right:'' // 오른쪽
        },
        footerToolbar: {
            /*left: 'today',*/
            left: '',
            center:'prev,next',
            /* right: 'dayGridMonth'*/
            right:''
        },
        initialView: 'dayGridMonth',
        navLinks: true, 
        businessHours: true, 
        editable: true,
        selectable: true,
       
	        // 이벤트 클릭 시 상세 정보 표시
	        eventClick: function(info) {
	            let details = '제목: ' + info.event.title;
	            if (info.event.extendedProps.description) {
	                details += '\n설명: ' + info.event.extendedProps.description;
	            }
	            if (info.event.extendedProps.location) {
	                details += '\n위치: ' + info.event.extendedProps.location;
	            }
	            alert(details);
	        },
	        
	        // 로딩 상태 표시
	        loading: function(bool) {
	            if (bool) {
	                console.log('캘린더 데이터 로딩 중...');
	            } else {
	                console.log('캘린더 데이터 로딩 완료!');
	            }
	        },
	        
	        // 에러 처리
	        eventSourceFailure: function(error) {
	            console.error('캘린더 데이터 로딩 실패:', error);
	            alert('캘린더 데이터를 불러오는데 실패했습니다. 토큰을 확인해주세요.');
	        }
        });
     
        calendar.render();
      });

    </script>
    <title>스케줄</title>
</head>
<body>
    <div class="total">
        <div class="top">
            <div class="s_logo">
        	    	<a href="/"><img src="images/hispark.png"></a>
   	        </div>
            <div class="title">
                <div class="title_01">
                    <span>가정통신문</span><br>  

                </div>
                <span class="title_02">청춘의 전류, 마음을 번쩍 깨우는 스파크가 되자</span>
            </div>
            <div class="s_no">
                <span>제2025-830호</span>
            </div>
        </div>
        <div class="main">
            <!-- <table>
                <tr>
                    <th class="day">일요일</th>
                    <th class="day">월요일</th>
                    <th class="day">화요일</th>
                    <th class="day">수요일</th>
                    <th class="day">목요일</th>
                    <th class="day">금요일</th> 
                    <th class="day">토요일</th>
                </tr>
		         </table> -->
            <div class="text_01">
                <p>학사일정</p>
            </div>
            <div id='calendar'></div>
            
        </div>
    </div>
</body>
</html>
